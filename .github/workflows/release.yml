name: ios
# Builds an unsigned Horizon.ipa on GitHub's macOS runner (no Mac needed).
# Put this file at .github/workflows/ios.yml, then run:
#   gh workflow run ios
# Download the artifact "Horizon.ipa" and install it with Sideloadly (signs with your free Apple ID).
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HORIZON_VERSION: ios-dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios

      - name: Build the client for iOS
        # No desktop-only features (ALSA, udev, code mods). If this fails, the errors show which
        # desktop-only code must be gated with #[cfg(not(target_os = "ios"))].
        run: cargo build --release --locked --target aarch64-apple-ios -p horizon-client --bin horizon-client --no-default-features

      - name: Make the .app bundle
        run: |
          set -euo pipefail
          app="Payload/Horizon.app"
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/horizon-client "$app/Horizon"
          cat > "$app/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Horizon</string>
            <key>CFBundleIdentifier</key><string>dev.horizon.client</string>
            <key>CFBundleName</key><string>Horizon</string>
            <key>CFBundleDisplayName</key><string>Horizon</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UIRequiresFullScreen</key><true/>
            <key>UIFileSharingEnabled</key><true/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          EOF
          # Remove the leading indentation the YAML block added.
          sed -i '' 's/^          //' "$app/Info.plist"

      - name: Zip into an IPA
        run: |
          zip -qry Horizon.ipa Payload
          ls -l Horizon.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Horizon.ipa
          path: Horizon.ipa
          if-no-files-found: error
          retention-days: 7
